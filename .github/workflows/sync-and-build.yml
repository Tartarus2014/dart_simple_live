name: Auto Sync and Build APK

on:
  schedule:
    # 每天 UTC 0:00 (北京时间早上 8:00) 自动检查并同步更新
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持随时在 GitHub Actions 页面手动点击触发

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # 1. 签出你的 Fork 仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 配置 Git 提交身份
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3. 添加原作者上游仓库并合并 dev 分支
      - name: Sync with upstream dev branch
        run: |
          git remote add upstream https://github.com/xiaoyaocz/dart_simple_live.git
          git fetch upstream dev
          git checkout dev
          
          # 检查上游是否有新提交
          UPSTREAM_DIFF=$(git rev-list HEAD..upstream/dev --count)
          if [ "$UPSTREAM_DIFF" -gt 0 ]; then
            echo "发现上游有 $UPSTREAM_DIFF 个新提交，开始合并..."
            git merge upstream/dev --no-edit
            git push origin dev
            echo "SYNC_UPDATED=true" >> $GITHUB_ENV
          else
            echo "上游暂无新更新"
            echo "SYNC_UPDATED=false" >> $GITHUB_ENV
          fi

      # 4. 如果有新更新或手动触发，自动调用 APK 打包任务
      - name: Trigger Build Workflow
        if: env.SYNC_UPDATED == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish_app_dev.yaml/dispatches \
            -d '{"ref":"dev"}'
